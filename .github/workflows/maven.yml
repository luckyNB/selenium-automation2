name: Test Automation Workflow

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    # Every day at 11:30 PM IST (18:00 UTC)
    - cron: '0 18 * * *'

  # Allows manual execution from GitHub Actions
  workflow_dispatch:

jobs:
  test:
    name: Run Selenium Automation Tests
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # Checkout source code
      # ---------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # Setup JDK 11
      # ---------------------------------------------------------
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven


      # ---------------------------------------------------------
      # Verify Java and Maven
      # ---------------------------------------------------------
      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version


      # ---------------------------------------------------------
      # Run Selenium TestNG Automation
      # ---------------------------------------------------------
      - name: Run Test Automation Framework
        run: |
          mvn clean test \
            -Dbrowser=chrome \
            -DisLambdaTest=true \
            -DisHeadless=true \
            -e
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}


      # ---------------------------------------------------------
      # Upload Surefire test results
      # Runs even if tests fail
      # ---------------------------------------------------------
      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            target/surefire-reports/
            target/*.dump
            target/*.dumpstream
          if-no-files-found: warn


      # ---------------------------------------------------------
      # Upload framework logs
      # ---------------------------------------------------------
      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: logs/
          if-no-files-found: warn


      # ---------------------------------------------------------
      # Upload HTML report
      # ---------------------------------------------------------
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.html
          if-no-files-found: warn


      # ---------------------------------------------------------
      # Final status message
      # ---------------------------------------------------------
      - name: Test Execution Completed
        if: always()
        run: |
          echo "======================================"
          echo "Test execution completed"
          echo "======================================"